<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Más Ejemplos de Eventos</title>
  <script src="misFunciones2.js" defer></script>
</head>
<body>

  <!-- 1. Evento change en menú desplegable -->
  <label for="selectorColor">Elige un color de fondo:</label>
  <select id="selectorColor">
    <option value="white">Blanco</option>
    <option value="lightblue">Azul claro</option>
    <option value="lightgreen">Verde claro</option>
    <option value="lightyellow">Amarillo claro</option>
  </select>
  <hr>

  <!-- 2. Eventos mouseover y mouseout -->
  <div id="cajaInfo" style="width: 220px; padding: 15px; border: 1px solid black;">
    Pasa el cursor por aquí
  </div>
  <p id="textoAyuda"></p>
  <hr>

  <!-- 3. Eventos focus y blur en campo de texto -->
  <label for="campoNombre">Tu nombre:</label>
  <input type="text" id="campoNombre" placeholder="Haz clic aquí para escribir">

</body>
</html>
