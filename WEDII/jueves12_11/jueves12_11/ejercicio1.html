<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejemplos de Eventos</title>
  <script src="misFunciones.js" defer></script>
</head>
<body>

  <!-- 1. Clic en botón -->
  <button id="btnTema">Cambiar a Modo Oscuro</button>
  <p id="mensaje">Modo claro activado.</p>
  <hr>

  <!-- 2. Validación de formulario -->
  <form id="formularioRegistro">
    <input type="email" id="correo" placeholder="Ingresa tu correo">
    <button type="submit">Enviar</button>
  </form>
  <hr>

  <!-- 3. Contador en tiempo real -->
  <textarea id="comentario" maxlength="100" placeholder="Escribe un comentario..."></textarea>
  <p>Caracteres restantes: <span id="contador">100</span></p>
  <hr>

  <!-- 4. Atajo de teclado -->
  <p>Presiona la tecla <strong>Escape</strong> en cualquier parte para ver una alerta.</p>
  <hr>

  <!-- 5. Delegación de eventos en lista -->
  <ul id="listaTareas">
    <li>Comprar pan</li>
    <li>Estudiar JavaScript</li>
    <li>Hacer ejercicio</li>
  </ul>

</body>
</html>
