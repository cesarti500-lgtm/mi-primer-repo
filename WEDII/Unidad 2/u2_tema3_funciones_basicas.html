<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Unidad 2 - Funciones</title>
</head>
<body>
    <h2>Calculadora de IGV y Descuentos</h2>
    <div id="reporte"></div>

    <script>
        // Función tradicional con return
        function calcularIGV(monto) {
            return monto * 0.18;
        }

        // Función flecha (Arrow Function)
        const calcularTotal = (monto, igv) => monto + igv;

        // Función con parámetros por defecto
        function aplicarDescuento(monto, porcentaje = 10) {
            return monto - (monto * (porcentaje / 100));
        }

        // Ejecución de pruebas
        let subtotal = 200;
        let igv = calcularIGV(subtotal);
        let totalSinDesc = calcularTotal(subtotal, igv);
        let totalConDesc = aplicarDescuento(totalSinDesc, 15);

        document.getElementById("reporte").innerHTML = `
            <p><strong>Subtotal:</strong> S/ $${subtotal.toFixed(2)}$</p>
            <p><strong>IGV (18%):</strong> S/ $${igv.toFixed(2)}$</p>
            <p><strong>Total Bruto:</strong> S/ $${totalSinDesc.toFixed(2)}$</p>
            <p><strong>Total con Descuento (15%):</strong> S/ $${totalConDesc.toFixed(2)}$</p>
        `;
    </script>
</body>
</html>
